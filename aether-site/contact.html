<body data-page="contact">

<div data-fade style="--d:.4s"><form class="glass form" id="form" novalidate>
<div class="f"><input name="n" placeholder=" " autocomplete="name"><label>Your name</label></div>
<div class="f"><input name="e" type="email" placeholder=" " autocomplete="email"><label>Email</label></div>
<p class="fl2">What do you need?</p><div class="chips"><button type="button" class="chip" data-g="sv" aria-pressed="false">Spatial web</button><button type="button" class="chip" data-g="sv" aria-pressed="false">Brand world</button><button type="button" class="chip" data-g="sv" aria-pressed="false">Launch film</button><button type="button" class="chip" data-g="sv" aria-pressed="false">Installation</button><button type="button" class="chip" data-g="sv" aria-pressed="false">Generative art</button><button type="button" class="chip" data-g="sv" aria-pressed="false">Retail</button></div><p class="fl2">Budget</p><div class="chips"><button type="button" class="chip" data-g="bd" aria-pressed="false">Under $25k</button><button type="button" class="chip" data-g="bd" aria-pressed="false">$25–75k</button><button type="button" class="chip" data-g="bd" aria-pressed="false">$75–150k</button><button type="button" class="chip" data-g="bd" aria-pressed="false">$150k+</button></div>
<div class="f"><textarea name="m" rows="4" placeholder=" "></textarea><label>Tell us about your project</label></div>
<p class="er" role="alert"></p><button class="btn p" data-mag type="submit">Send message <i data-arw></i></button></form>

<h2 class="h2 s">Message received.</h2><p class="lead">Thank you. A member of the studio will reply within one business day.</p><button class="btn" data-again>Send another</button></div></div></section></main>
